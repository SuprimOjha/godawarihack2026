{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ================= RESET (NAVBAR ONLY) ================= */
.site-navbar * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ================= HEADER ================= */
.site-navbar header {
    background: #fff;
    padding: 1rem 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.site-navbar nav {
    max-width: 1200px;
    margin: auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* ================= LOGO ================= */
.site-navbar .logo img {
    height: 50px;
}

/* ================= DESKTOP NAV ================= */
.site-navbar .nav-links {
    list-style: none;
    display: flex;
    gap: 3rem;
    align-items: center;
}

.site-navbar .nav-links a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
    position: relative;
    padding-bottom: 0.4rem;
}

/* Hover underline animation */
.site-navbar .nav-links a::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0%;
    height: 2px;
    background: #6aab32;
    transition: width 0.3s ease;
}

.site-navbar .nav-links a:hover::after {
    width: 100%;
}

.site-navbar .nav-links a:hover {
    color: #6aab32;
}

/* ================= DROPDOWN ================= */
.site-navbar .dropdown-link {
    display: flex;
    align-items: center;
    gap: 0.3rem;
}

/* ICON ANIMATION */
.site-navbar .dropdown-link svg {
    width: 14px;
    height: 14px;
    transition: transform 0.3s ease;
}

.site-navbar .nav-links li:hover .dropdown-link svg {
    transform: rotate(180deg);
}

.site-navbar .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px); /* directly below link */
    left: 0;
    min-width: 220px;
    list-style: none;
    background: white;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.25s ease;
    padding: 0.5rem 0;
    z-index: 1000;
}


.site-navbar .nav-links li:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.site-navbar .dropdown-menu a {
    display: block;
    padding: 0.8rem 1.5rem;
    color: #333;
}

.site-navbar .dropdown-menu a:hover {
    background: #6aab3215;
    color: #6aab32;
    padding-left: 2rem;
}

/* ================= LOGIN BUTTON ================= */
.site-navbar .quick-enquiry {
    border: 2px solid #6aab32;
    background: transparent;
    padding: 0.7rem 1.5rem;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}

.site-navbar .quick-enquiry:hover {
    background: #6aab32;
    color: white;
}

/* ================= LANGUAGE SWITCH ================= */
.site-navbar .lang-switch {
    display: flex;
    gap: 8px;
}

.site-navbar .lang-switch button {
    border: 2px solid #6aab32;
    background: transparent;
    color: #6aab32;
    padding: 6px 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.site-navbar .lang-switch button:hover {
    background: #6aab32;
    color: white;
    transform: translateY(-2px);
}

.site-navbar .lang-switch button.active {
    background: #6aab32;
    color: white;
}

/* ================= MOBILE MENU ================= */
.site-navbar .mobile-menu-btn {
    display: none;
    font-size: 1.6rem;
    background: none;
    border: none;
    cursor: pointer;
}

.site-navbar .mobile-nav {
    position: fixed;
    top: 0;
    left: -100%;
    width: 80%;
    max-width: 300px;
    height: 100vh;
    background: white;
    padding: 2rem;
    transition: 0.3s;
    z-index: 1000;
}

.site-navbar .mobile-nav.active {
    left: 0;
}

.site-navbar .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
}

.site-navbar .overlay.active {
    display: block;
}

.site-navbar .mobile-nav ul {
    list-style: none;
}

.site-navbar .mobile-nav a {
    display: block;
    padding: 0.8rem;
    color: #333;
}

.site-navbar .mobile-dropdown-toggle {
    display: flex;
    justify-content: space-between;
    cursor: pointer;
}

/* Mobile icon animation */
.site-navbar .mobile-dropdown-toggle svg {
    transition: transform 0.3s ease;
}

.site-navbar .mobile-dropdown-toggle.active svg {
    transform: rotate(180deg);
}
.site-navbar .nav-links li {
    position: relative;
}


.site-navbar .mobile-dropdown {
    display: none;
    margin-left: 1rem;
}

.site-navbar .mobile-dropdown.active {
    display: block;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    .site-navbar .nav-links,
    .site-navbar .quick-enquiry,
    .site-navbar .lang-switch {
        display: none;
    }
    .site-navbar .mobile-menu-btn {
        display: block;
    }
}
</style>
</head>

function setLanguage(lang) {
    localStorage.setItem("siteLang", lang);
    applyLanguage(lang);
    document.getElementById("btn-en").classList.toggle("active", lang === "en");
    document.getElementById("btn-ne").classList.toggle("active", lang === "ne");
}

function applyLanguage(lang) {
    document.querySelectorAll("[data-key]").forEach(el => {
        if (translations[lang][el.dataset.key]) {
            el.innerText = translations[lang][el.dataset.key];
        }
    });
}

document.addEventListener("DOMContentLoaded", () => {
    const lang = localStorage.getItem("siteLang") || "en";
    setLanguage(lang);
});
