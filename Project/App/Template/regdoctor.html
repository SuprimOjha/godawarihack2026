<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Credentialing | MedSaathi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --accent: #0ea5e9;
            --success: #10b981;
            --error: #ef4444;
            --bg-soft: #f8fafc;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Header Enhancement */
        .form-header {
            background: #ffffff;
            padding: 3rem 2.5rem 1.5rem;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .form-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.025em;
        }

        .form-header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .form-content {
            padding: 2.5rem;
        }

        /* Section Styling */
        .form-section {
            margin-bottom: 3rem;
        }

        .section-title {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 1rem;
        }

        /* Layout Grid */
        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: span 2;
        }

        /* Input Styling */
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #334155;
        }

        .required {
            color: var(--error);
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Custom Checkbox Design */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.75rem;
            background: var(--bg-soft);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-option input {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        /* Modern File Upload */
        .file-upload-card {
            border: 2px dashed var(--border);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            transition: border-color 0.2s;
            cursor: pointer;
            background: var(--bg-soft);
        }

        .file-upload-card:hover {
            border-color: var(--primary);
        }

        .file-upload-card span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Terms & Conditions Box */
        .terms-card {
            background: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 1.25rem;
            border-radius: 0 8px 8px 0;
            margin: 2rem 0;
        }

        /* Buttons */
        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        button {
            padding: 0.75rem 2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-reset {
            background: transparent;
            color: var(--secondary);
            border: 1px solid var(--border);
        }

        .btn-reset:hover {
            background: #f8fafc;
            color: var(--text-main);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .full-width { grid-column: auto; }
            .form-content { padding: 1.5rem; }
            .button-group { flex-direction: column-reverse; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="form-header">
        <h1>Provider Registration</h1>
        <p>Complete the credentialing form to join the MedSaathi clinical network.</p>
    </header>

    <div class="form-content">
        <form id="doctorForm" onsubmit="handleSubmit(event)">
            
            <section class="form-section">
                <h2 class="section-title">Personal Profile</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name <span class="required">*</span></label>
                        <input type="text" name="firstName" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name <span class="required">*</span></label>
                        <input type="text" name="lastName" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" name="email" placeholder="john.doe@hospital.com" required>
                    </div>
                    <div class="form-group">
                        <label>Primary Contact Number <span class="required">*</span></label>
                        <input type="tel" name="phone" placeholder="+977-XXXXXXXXXX" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">Clinical Credentials</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Medical License Number <span class="required">*</span></label>
                        <input type="text" name="licenseNumber" required>
                    </div>
                    <div class="form-group">
                        <label>Years of Clinical Experience <span class="required">*</span></label>
                        <input type="number" name="experience" min="0" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Primary Specialization <span class="required">*</span></label>
                        <select name="specialization" required>
                            <option value="">Select Specialization</option>
                            <option value="cardiology">Cardiology</option>
                            <option value="dermatology">Dermatology</option>
                            <option value="general-practice">General Practice</option>
                            <option value="pediatrics">Pediatrics</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Medical Degree <span class="required">*</span></label>
                        <input type="text" name="degree" placeholder="MBBS, MD, etc." required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">Services & Availability</h2>
                <div class="form-group full-width" style="margin-bottom: 1.5rem;">
                    <label>Scope of Practice <span class="required">*</span></label>
                    <div class="checkbox-group">
                        <label class="checkbox-option"><input type="checkbox" name="services" value="consultation"> In-person Consultation</label>
                        <label class="checkbox-option"><input type="checkbox" name="services" value="telemedicine"> Telemedicine</label>
                        <label class="checkbox-option"><input type="checkbox" name="services" value="emergency"> Emergency Care</label>
                        <label class="checkbox-option"><input type="checkbox" name="services" value="surgery"> Surgical Procedures</label>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Standard Consultation Fee (NPR) <span class="required">*</span></label>
                        <input type="number" name="consultationFee" placeholder="800" required>
                    </div>
                    <div class="form-group">
                        <label>Languages Spoken <span class="required">*</span></label>
                        <input type="text" name="languages" placeholder="English, Nepali" required>
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2 class="section-title">Compliance Documents</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Medical License (PDF/Image) <span class="required">*</span></label>
                        <div class="file-upload-card" onclick="document.getElementById('license').click()">
                            <input type="file" id="license" name="license" hidden required onchange="updateFileName('license')">
                            <strong>Click to upload</strong>
                            <span id="license-name">No file selected</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Professional Headshot</label>
                        <div class="file-upload-card" onclick="document.getElementById('photo').click()">
                            <input type="file" id="photo" name="photo" hidden onchange="updateFileName('photo')">
                            <strong>Click to upload</strong>
                            <span id="photo-name">No file selected</span>
                        </div>
                    </div>
                </div>
            </section>

            <div class="terms-card">
                <label class="checkbox-option">
                    <input type="checkbox" name="terms" required>
                    <span style="font-size: 0.85rem; color: #475569;">
                        I certify that the information provided is true and accurate. I agree to the 
                        <strong>Provider Terms of Service</strong> and <strong>Data Privacy Policy</strong>.
                    </span>
                </label>
            </div>

            <div class="button-group">
                <button type="reset" class="btn-reset">Clear Form</button>
                <button type="submit" class="btn-submit">Submit Application</button>
            </div>
        </form>
    </div>
</div>

<script>
    function updateFileName(inputId) {
        const input = document.getElementById(inputId);
        const nameSpan = document.getElementById(inputId + '-name');
        nameSpan.textContent = input.files.length > 0 ? input.files[0].name : 'No file selected';
        if(input.files.length > 0) nameSpan.style.color = '#2563eb';
    }

    function handleSubmit(event) {
        event.preventDefault();
        // Validation logic here
        alert('Application submitted for review. You will receive an email confirmation shortly.');
    }
</script>

</body>
</html>
